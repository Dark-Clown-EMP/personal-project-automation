server:
  port: 8082

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      # 1. The "Client" Section (Where the SECRET goes)
      # This allows the Gateway to redirect users to Keycloak for Login
      client:
        registration:
          gateway-client: # This name is internal to Spring
            provider: keycloak
            client-id: gateway-client # Must match Keycloak exactly
            client-secret: ax6ZvkMUaTEsVhOaOZRFgFLkQrYBJ5Tr  # <--- PASTE IT HERE
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/db-realm

      # 2. The "Resource Server" Section (Validation)
      # This allows the Gateway to verify the JWT signature
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/db-realm

  cloud:
    gateway:
      routes:
        - id: ingestion-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/payments/**